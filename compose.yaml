services:
  assistant:
    image: ghcr.io/rubiss-projects/ai-assistant:latest
    build:
      context: .
    restart: unless-stopped
    # Allow the default 10-minute scheduled inference timeout plus delivery/cleanup.
    stop_grace_period: 11m
    init: true
    env_file:
      - .env
    environment:
      HOME: /data
      AI_ASSISTANT_CONFIG_DIR: /data
      # Provider tools can access this directory, but not the adjacent login state under /data.
      AI_ASSISTANT_WORKSPACE_ROOT: /data/workspaces
      REGISTER_COMMANDS_ON_START: ${REGISTER_COMMANDS_ON_START:-true}
      AI_ASSISTANT_BROWSER_URL: http://browser:3123
      GITHUB_CONTRIBUTIONS_PUBLISH_LIMIT: ${GITHUB_CONTRIBUTIONS_PUBLISH_LIMIT:-20}
      CODEX_REVIEW_LIMIT: ${CODEX_REVIEW_LIMIT:-20}
      CODEX_WEB_SEARCH_MODE: ${CODEX_WEB_SEARCH_MODE:-cached}
    depends_on:
      browser:
        condition: service_healthy
    networks:
      - default
      - browser-control
    volumes:
      # Named volume only: no part of the host filesystem is exposed to the agent.
      - assistant-data:/data
      - review-control:/review-control
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Keep Docker syscall filtering while permitting the Chromium/Codex namespaces.
      - seccomp=./seccomp.json
    pids_limit: 256

  browser:
    image: ghcr.io/rubiss-projects/ai-assistant:latest
    build:
      context: .
    entrypoint: ["node", "/app/dist/src/browserWorker.js"]
    restart: unless-stopped
    init: true
    # A separate cgroup contains native DOM, ArrayBuffer/Wasm and every child process.
    # No bot credentials, provider state or data volumes enter this service.
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp.json
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3123/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - browser-control
      - browser-egress

  reviewer:
    image: ghcr.io/rubiss-projects/ai-assistant:latest
    build:
      context: .
    profiles: [reviews]
    entrypoint: ["node", "/app/dist/src/reviewWorker.js"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      HOME: /data
      CODEX_HOME: /data/.codex
      CODEX_REVIEW_MODEL: ${CODEX_REVIEW_MODEL:-gpt-6-astra}
      CODEX_REVIEW_REASONING_EFFORT: ${CODEX_REVIEW_REASONING_EFFORT:-medium}
      CODEX_REVIEW_LIMIT: ${CODEX_REVIEW_LIMIT:-20}
    # Deliberately no env_file, assistant data, GitHub credentials, Docker socket, or TCP listener.
    volumes:
      - review-data:/data
      - review-control:/review-control
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp.json
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--unix-socket", "/review-control/review.sock", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - review-egress

volumes:
  assistant-data:
  review-data:
  review-control:

networks:
  browser-control:
    internal: true
  browser-egress:
  review-egress:
